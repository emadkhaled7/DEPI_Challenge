name: challenge

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/food/
    - assets/coffee/
    - assets/courses/
    - assets/books/
    - assets/movies/
    - assets/products/
    - assets/real_estate/
    - assets/fitness/
    - assets/travel/
    - assets/delivery/
    - assets/quran/
    - assets/tickets/
    - assets/hotel/
    - assets/car/
    - assets/home/

  fonts:
    - family: Facebook
      fonts:
        - asset: assets/fonts/facebook-Bold.ttf

    - family: Grindy
      fonts:
        - asset: assets/fonts/Grindy Brush.otf

    - family: Heylowitch
      fonts:
        - asset: assets/fonts/Heylowitch-Regular.otf